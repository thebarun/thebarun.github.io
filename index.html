<style>:root{--canvas:#F2F5F7;--paper:#FFF;--ink:#16212B;--fog:#5F6B77;--hair:#E3E8EC;--teal:#196F8F;--teal-soft:#E8F1F5;--brick:#B23A2E;--brick-soft:#FBEDEB;--r:20px;--shadow:0 1px 2px rgba(22,50,68,.05),0 6px 18px rgba(22,50,68,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:440px;margin:0 auto;padding:20px 16px 96px}.num{font-variant-numeric:tabular-nums}
.head{padding:6px 4px 16px}.eyebrow{font-size:13px;font-weight:700;color:var(--teal)}.name{font-size:20px;font-weight:800;margin:4px 0 2px}.lead{font-size:14px;color:var(--fog)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 12px;font-size:14px;color:var(--fog)}.total b{font-size:18px;color:var(--ink)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:12px}.title{font-size:15px;font-weight:700}
.lab{font-size:13px;color:var(--fog);margin-top:14px}.amt{font-size:clamp(30px,9vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.2}.add{font-size:13px;color:var(--brick)}
.due{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:15px;margin-top:6px}.due b{font-weight:800}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--teal-soft);color:var(--teal)}.pill.soon{background:var(--teal);color:#fff}.pill.late{background:var(--brick);color:#fff}.dnote{width:100%;font-size:13px;color:var(--fog)}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}.sec-h{font-size:13px;font-weight:700;color:var(--fog);margin-bottom:6px}.accts{border-left:3px solid var(--teal);padding-left:12px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}.accts .row:first-child,.eno .row{border-top:0}
.bank{font-size:13px;color:var(--fog)}.no{font-size:18px;font-weight:800;letter-spacing:.01em;word-break:break-all}.valid{font-size:12.5px;color:var(--fog);margin-top:4px}
.cp{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--teal);background:var(--paper);color:var(--teal);font:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s ease-out}.cp:active{transform:translateY(1px)}.cp.ok{background:var(--teal);color:#fff}.cp svg{width:16px;height:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}.facts dt{color:var(--fog)}.facts dd{margin:0}.note{font-size:13px;color:var(--fog);margin-top:14px}
.eno{margin-top:16px;padding-top:14px;border-top:1px dashed #C9D3DA}.late-bar{background:var(--brick-soft);color:var(--brick);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;margin-bottom:12px}.foot{font-size:12.5px;color:var(--fog);padding:4px}
.msg{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px}.msg b{display:block;font-size:16px;margin-bottom:4px}.msg span{font-size:14px;color:var(--fog)}
.sk{background:var(--paper);border-radius:var(--r);padding:20px}.bar{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,#EBEFF2,#F5F7F9,#EBEFF2);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite}.bar.big{height:30px;width:60%}@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.in{opacity:0;transform:translateY(8px);animation:rise .35s cubic-bezier(.2,.7,.3,1) forwards}@keyframes rise{to{opacity:1;transform:none}}
.fix{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px;background:rgba(242,245,247,.95);border-top:1px solid var(--hair)}
.fix a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;text-decoration:none;font-size:15px;font-weight:800}.call{background:var(--teal);color:#fff}.kk{background:var(--paper);color:var(--ink);border:1.5px solid var(--hair)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(22,33,43,.92);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.in,.bar{animation:none;opacity:1;transform:none}}</style></head><body><noscript><main><div class="msg"><b>이 브라우저에서는 열 수 없습니다</b><span>다른 브라우저로 열어 주시거나 02-2088-1264 로 연락 주시기 바랍니다.</span></div></main></noscript><main id="app" aria-live="polite"><div class="sk"><div class="bar" style="width:40%"></div><div class="bar big"></div><div class="bar" style="width:80%"></div></div></main><nav class="fix"><a class="call" href="tel:02-2088-1264">사무실 전화</a><a class="kk" href="http://pf.kakao.com/_mkRxoG/chat" target="_blank" rel="noopener">카카오톡 문의</a></nav><div id="toast" class="toast" role="status"></div><script>(function payClient_() {
  const OFFICE = '더바른 세무회계';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const won = (n) => Number(n || 0).toLocaleString('ko-KR');
  const b64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
  const fail = (t, sub) => { app.innerHTML = '<div class="msg in"><b>' + esc(t) + '</b><span>' + esc(sub || '') + '</span></div>'; };
  let tt = null;
  const toast = (t) => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1600); };
  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  const cpBtn = (val, what) => '<button class="cp" data-c="' + esc(val) + '" aria-label="' + esc(what) + ' 복사">' + ICON + '<span>복사</span></button>';
  async function copy(txt, btn) { // 구글 화면 틀 안이라 clipboard 가 막히면 옛 방식으로
    let ok = false;
    try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0'; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, txt.length); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } ta.remove();
    }
    const lab = btn.querySelector('span');
    if (ok) { lab.textContent = '복사됨'; btn.classList.add('ok'); toast('복사되었습니다. 은행 앱에 붙여넣어 주십시오'); setTimeout(() => { lab.textContent = '복사'; btn.classList.remove('ok'); }, 2500); }
    else toast('번호를 길게 눌러 직접 복사해 주십시오');
  }
  const dday = (iso) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
    const t = new Date(), a = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()), p = iso.split('-').map(Number);
    return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - a) / 864e5);
  };
  function card(x, i) {
    const dd = dday(x.due), late = dd != null && dd < 0, soon = dd != null && dd >= 0 && dd <= 7;
    const accts = (x.accts || []).map((a) => '<div class="row"><div><div class="bank">' + esc(a.bank) + '</div><div class="no num">' + esc(a.no) + '</div></div>' + cpBtn(a.no, a.bank + ' 계좌번호') + '</div>').join('');
    const rows = (x.rows || []).filter((r) => r && r[1]).map((r) => '<dt>' + esc(r[0]) + '</dt><dd class="num">' + esc(r[1]) + '</dd>').join('');
    const pill = dd == null ? '' : '<span class="pill' + (late ? ' late' : soon ? ' soon' : '') + '">' + (dd > 0 ? 'D-' + dd : dd === 0 ? '오늘까지' : '기한 지남') + '</span>';
    return '<section class="card in" style="animation-delay:' + 60 * (i + 1) + 'ms"><div class="title">' + esc(x.title) + '</div><div class="lab">납부할 세액</div><div class="amt num">' + won(x.amt) + '원</div>' +
      (x.add > 0 ? '<div class="add num">가산세 ' + won(x.add) + '원 포함</div>' : '') +
      '<div class="due"><span>납부기한</span><b class="num">' + esc(x.dueText || x.due) + '</b>' + pill + (x.dueNote ? '<span class="dnote">' + esc(x.dueNote) + '</span>' : '') + '</div>' +
      (accts ? '<div class="sec"><div class="sec-h">납부 계좌 · 아래 중 한 곳으로 이체</div><div class="accts">' + accts + '</div>' + (x.valid ? '<div class="valid num">가상계좌 유효기간 ' + esc(x.valid) + ' · 밤 11시까지 납부 가능</div>' : '') + '</div>' : '') +
      (rows ? '<div class="sec"><dl class="facts">' + rows + '</dl></div>' : '') + (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') +
      (x.eno ? '<div class="eno"><div class="sec-h">전자납부번호 · 은행 앱 \'국세 납부\'용</div><div class="row"><div class="no num">' + esc(x.eno) + '</div>' + cpBtn(x.eno, '전자납부번호') + '</div></div>' : '') + '</section>';
  }
  async function show(bin, k) {
    let data;
    try {
      const buf = b64u(bin).buffer;
      const key = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
      data = JSON.parse(new TextDecoder().decode(plain));
    } catch (e) { return fail('이 링크로는 열 수 없습니다', '링크가 일부 잘렸거나 변경된 것으로 보입니다. 당 사무실로 연락 주시기 바랍니다.'); }
    const items = data.items || [], late = items.some((x) => (dday(x.due) == null ? 0 : dday(x.due)) < 0), sum = items.reduce((t, x) => t + (+x.amt || 0), 0);
    app.innerHTML = '<header class="head in"><div class="eyebrow">' + OFFICE + ' · 납부 안내</div><div class="name">' + esc(data.name) + '</div><div class="lead">계좌번호 옆 [복사]를 누르신 후 은행 앱에 붙여넣어 주십시오.</div></header>' +
      (late ? '<div class="late-bar in">납부기한이 경과한 건이 있습니다. 이미 납부하셨다면 참고만 해 주시고, 납부 전이시라면 당 사무실로 연락 주시기 바랍니다.</div>' : '') +
      (items.length > 1 ? '<div class="total in"><span>' + items.length + '건 · 건마다 계좌가 다릅니다</span><b class="num">합계 ' + won(sum) + '원</b></div>' : '') +
      items.map(card).join('') + '<div class="foot in">' + OFFICE + '에서 ' + esc(String(data.made || '').slice(0, 10)) + '에 보낸 안내입니다.</div>';
    app.querySelectorAll('.cp').forEach((b) => b.addEventListener('click', () => copy(b.getAttribute('data-c'), b)));
  }
  const B62 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const sha = async (s) => new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)));
  // 짧은 링크(…/exec#22자): 저장 이름과 열쇠를 22자 표에서 계산(세무대시보드 payTokenParts 와 같은 계산). 옛 링크(?pay=이름#열쇠)는 그대로 열림
  async function tokenParts(t) {
    const n = await sha('pay-name:' + t), kb = await sha('pay-key:' + t);
    return { f: Array.from(n.slice(0, 24), (b) => B62[b % 62]).join(''), k: btoa(String.fromCharCode.apply(null, kb)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
  }
  (async () => {
    const loc = { parameter: {}, hash: location.hash };
    let f = String((loc.parameter && loc.parameter.pay) || ''), k = String(loc.hash || '').replace(/^#/, '');
    if (!f && /^[A-Za-z0-9]{22}$/.test(k)) {
      try { const p = await tokenParts(k); f = p.f; k = p.k; } catch (e) { return fail('이 링크로는 열 수 없습니다', '이 휴대폰 브라우저에서 열리지 않습니다. 당 사무실로 연락 주시기 바랍니다.'); }
    }
    if (!/^[A-Za-z0-9]{24}$/.test(f) || !/^[A-Za-z0-9_-]{43}$/.test(k)) return fail('이 링크로는 열 수 없습니다', '받으신 링크 전체를 그대로 눌러 주십시오. 계속 열리지 않으면 당 사무실로 연락 주시기 바랍니다.');
    // 쿠키 없이 팀 서버에서 암호문만 받음(열쇠 k 는 보내지 않음)
    fetch('https://script.google.com/macros/s/AKfycbw-F_NAFmuGlX2w_IZjv-dGbzvgpzT2WoIOcKrsuRngpZ3lsU_zwqz8E8dlYHn6UCbJ/exec', { method: 'POST', credentials: 'omit', body: JSON.stringify({ fn: 'payFetch', cred: '', args: [f] }) })
      .then((r) => r.json())
      .then((j) => (j.ok && j.data ? show(j.data, k) : fail('열람 기간이 지났거나 확인되지 않는 안내입니다', '납부기한이 상당 기간 경과한 경우 당 사무실로 연락 주시기 바랍니다.')))
      .catch(() => fail('잠시 후 다시 열어 주십시오', '연결이 원활하지 않습니다.'));
  })();
})();</script></body></html>
