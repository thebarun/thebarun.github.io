      try { const p = await tokenParts(k); f = p.f; k = p.k; } catch (e) { return fail('이 링크로는 열 수 없습니다', '이 휴대폰 브라우저에서 열리지 않습니다. 당 사무실로 연락 주시기 바랍니다.'); }
    }
    if (!/^[A-Za-z0-9]{24}$/.test(f) || !/^[A-Za-z0-9_-]{43}$/.test(k)) return fail('이 링크로는 열 수 없습니다', '받으신 링크 전체를 그대로 눌러 주십시오. 계속 열리지 않으면 당 사무실로 연락 주시기 바랍니다.');
    // 쿠키 없이 팀 서버에서 암호문만 받음(열쇠 k 는 보내지 않음)
    fetch('https://script.google.com/macros/s/AKfycbw-F_NAFmuGlX2w_IZjv-dGbzvgpzT2WoIOcKrsuRngpZ3lsU_zwqz8E8dlYHn6UCbJ/exec', { method: 'POST', credentials: 'omit', body: JSON.stringify({ fn: 'payFetch', cred: '', args: [f] }) })
      .then((r) => r.json())
      .then((j) => (j.ok && j.data ? show(j.data, k, f) : fail('열람 기간이 지났거나 확인되지 않는 안내입니다', '납부기한이 상당 기간 경과한 경우 당 사무실로 연락 주시기 바랍니다.')))
      .catch(() => fail('잠시 후 다시 열어 주십시오', '연결이 원활하지 않습니다.'));
  })();
})();</script></body></html>
